services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?"MYSQL_ROOT_PASSWORD is required"}
      MYSQL_DATABASE: go_backend
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?"MYSQL_PASSWORD is required"}
    ports:
      # 映射 Windows 3307 到容器 3306
      - "127.0.0.1:13307:3306"
    volumes:
      # 挂载 mysql-data 到 /var/lib/mysql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  migrate:
    image: ${MIGRATION_IMAGE:?"MIGRATION_IAMGE is required"}
    volumes: !reset []

    depends_on:
      mysql:
        condition: service_healthy
    command:
      - "-path=/migrations"
      - "-database=${DOCKER_MIGRATE_DATABASE_URL}"
      - "up"
    restart: "no"
  
  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully


    environment:
      MYSQL_DSN: ${DOCKER_MYSQL_DSN:?"DOCKER_MYSQL_DSN is required"}
      APP_ENV: development

      HTTP_ADDR: ":8080"
      MYSQL_MAX_OPEN_CONNS: 10
      MYSQL_MAX_IDLE_CONNS: 5
      MYSQL_CONN_MAX_LIFETIME: 3m

      HTTP_READ_HEADER_TIMEOUT: 5s
      HTTP_READ_TIMEOUT: 15s
      HTTP_WRITE_TIMEOUT: 15s
      HTTP_IDLE_TIMEOUT: 60s

    ports:
      - "127.0.0.1:8080:8080"

    restart: "unless-stopped"


volumes:
  mysql-data:

