name: Go CI

# 配置 push、pull_request 触发条件
on:
    push:
      branches: [ "main" ]
      tags: [ "v*" ]
    pull_request:
      branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      MYSQL_GO_DSN: "app:app@tcp(localhost:3306)/go_backend_test?parseTime=true"
      MIGRATE_TEST_DATABASE_URL: "mysql://app:app@tcp(localhost:3306)/go_backend_test?parseTime=true"

    services:
      mysql:
        image: mysql:8.0.46
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: go_backend_test
          MYSQL_USER: app
          MYSQL_PASSWORD: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      #  检出代码
      - name: 检出代码
        uses: actions/checkout@v7

      #  配置 Go 环境
      # 从 go.mod 读取 Go 版本
      - name: 配置 Go 环境
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
        
      - name: 检查Go格式
        run: test -z "$(gofmt -l .)"

      # 执行静态检查
      # go vet ./...
      - name: 执行静态检查
        run: go vet ./...

      - name: 执行测试
        run: go test -count=1 ./...

      - name: 进行编译
        run: go build ./...

  docker-build:
    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'  
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # GitHub Token，由 GitHub 自动生成

      - name: 生成API tag
        id: tag
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 生成Migration tag
        id: migrate-tag
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-migrate
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 构建 Docker 镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tag.outputs.tags }}
          labels: ${{ steps.tag.outputs.labels }}

          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      
      - name: 构建Migration镜像
        uses: docker/build-push-action@v7
        with:
          context: ./migrations
          file: ./migrations/Dockerfile.migrate
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.migrate-tag.outputs.tags }}
          labels: ${{ steps.migrate-tag.outputs.labels }}

          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration